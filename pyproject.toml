[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-alpha"
version = "0.1.0"
description = "Dependency-free intraday factor-residual mean-reversion research engine"
requires-python = ">=3.11"

[project.scripts]
residual-alpha = "residual_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["residual_alpha*"]

